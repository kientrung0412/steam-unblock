[package]
name = "steam-unblock"
version = "0.1.1"
edition = "2021"
description = "Truy cập Steam khi bị nhà mạng chặn: proxy cục bộ + DNS-over-HTTPS + chia nhỏ TLS ClientHello"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
